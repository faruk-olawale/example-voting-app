# Default values for voting-app Helm chart

vote:
  replicaCount: 1
  image:
    repository: ghcr.io/faruk-olawale/voting-app-vote
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    targetPort: 8080
    nodePort: 31000
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  env:
    optionA: "Cats"
    optionB: "Dogs"

result:
  replicaCount: 1
  image:
    repository: ghcr.io/faruk-olawale/voting-app-result
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8081
    targetPort: 8081
    nodePort: 31001
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

worker:
  replicaCount: 1
  image:
    repository: ghcr.io/faruk-olawale/voting-app-worker
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

redis:
  image:
    repository: redis
    tag: "alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379

db:
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  env:
    postgresUser: "postgres"
    postgresPassword: "postgres"
    postgresDb: "postgres"
  service:
    port: 5432
  persistence:
    enabled: true
    storageSize: 1Gi
